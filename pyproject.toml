[project]
name = "netcrawl-workspace"
version = "0.1.0"
description = "Starter workspace for NetCrawl — write Python workers to automate your network."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # A range, not an exact pin. An "==" pin cannot pick up a protocol fix
    # without an edit to this repo, which is how a starter Codespace ended up
    # running an SDK the server no longer spoke. The server enforces the lower
    # bound too, so a runtime below it is refused with one actionable sentence
    # instead of silently misreading commands.
    "netcrawl-sdk>=1.4.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
