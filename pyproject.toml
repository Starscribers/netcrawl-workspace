[project]
name = "netcrawl-workspace"
version = "0.1.0"
description = "Starter workspace for NetCrawl — write Python workers to automate your network."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "netcrawl-sdk==1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
